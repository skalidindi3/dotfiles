---
- name: Configure Linux
  hosts: all
  remote_user: chaitu

  vars:
    dotfiles_repo: git@github.com:skalidindi3/dotfiles.git
    github_private_key_dest: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519"

  tasks:
    - name: Authorize this laptop's SSH key
      ansible.posix.authorized_key:
        user: chaitu
        key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"
        state: present
        exclusive: false
      tags: [access]

    - name: Install the GitHub private key without replacing existing contents
      tags: [github]
      block:
        - name: Require a source key path
          ansible.builtin.assert:
            that:
              - github_private_key_file is defined
              - github_private_key_file | default('') | length > 0
            fail_msg: Supply the controller's key path with -e github_private_key_file=/path/to/key.

        - name: Inspect the source key on the controller
          ansible.builtin.stat:
            path: "{{ github_private_key_file | expanduser }}"
            follow: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: github_source_key

        - name: Require a readable source key file
          ansible.builtin.assert:
            that:
              - github_source_key.stat.isreg | default(false)
              - github_source_key.stat.checksum is defined
            fail_msg: The source key must be an existing, readable regular file on the controller.

        - name: Inspect the destination key
          ansible.builtin.stat:
            path: "{{ github_private_key_dest }}"
            follow: false
            checksum_algorithm: sha256
          register: github_destination_key

        - name: Refuse to replace a different key or a non-regular destination
          ansible.builtin.assert:
            that:
              - >-
                not github_destination_key.stat.exists or
                ((github_destination_key.stat.isreg | default(false)) and
                 (github_destination_key.stat.checksum | default('')) == github_source_key.stat.checksum)
            fail_msg: The destination exists and differs from the source, or is not a regular file. It has not been overwritten.

        - name: Ensure the key directory is private
          ansible.builtin.file:
            path: "{{ github_private_key_dest | dirname }}"
            state: directory
            mode: "0700"

        - name: Copy the private key only when absent
          ansible.builtin.copy:
            src: "{{ github_private_key_file | expanduser }}"
            dest: "{{ github_private_key_dest }}"
            mode: "0600"
            force: false
          no_log: true
          diff: false

    - name: Install Ubuntu prerequisites
      become: true
      ansible.builtin.apt:
        name: [git, curl, ca-certificates, build-essential, zsh]
        state: present
        update_cache: true
      tags: [base]

    - name: Initialize Zsh
      tags: [zsh]
      block:
        - name: Register Zsh as an allowed login shell
          become: true
          ansible.builtin.lineinfile:
            path: /etc/shells
            line: /usr/bin/zsh

        - name: Create the Zsh cache directory
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.cache/zsh"
            state: directory
            mode: "0700"

        - name: Ensure the Zsh history file exists
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.cache/zsh/zsh_history"
            state: touch
            mode: "0600"
            access_time: preserve
            modification_time: preserve

        - name: Set Zsh as the remote user's login shell
          become: true
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            shell: /usr/bin/zsh

    - name: Configure GitHub SSH host verification
      tags: [dotfiles]
      block:
        - name: Ensure the remote SSH directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.ssh"
            state: directory
            mode: "0700"

        - name: Fetch GitHub's published host keys over verified HTTPS
          ansible.builtin.uri:
            url: https://api.github.com/meta
            return_content: true
            validate_certs: true
            use_netrc: false
          delegate_to: localhost
          become: false
          register: github_host_metadata

        - name: Add GitHub host keys to the remote known_hosts file
          ansible.builtin.known_hosts:
            path: "{{ ansible_facts['user_dir'] }}/.ssh/known_hosts"
            name: github.com
            key: "github.com {{ item }}"
            state: present
          loop: "{{ github_host_metadata.json.ssh_keys }}"

    - name: Download dotfiles to the remote user's home directory
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ ansible_facts['user_dir'] }}/dotfiles"
        key_file: "{{ github_private_key_dest }}"
        ssh_opts: -o StrictHostKeyChecking=yes
        # preserve an existing checkout and leave the private submodule uninitialized.
        update: false
        force: false
        recursive: false
      environment:
        GIT_TERMINAL_PROMPT: "0"
      tags: [dotfiles]

    - name: Initialize and bootstrap dotfiles
      tags: [dotfiles]
      environment:
        PATH: "{{ ansible_facts['user_dir'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:{{ ansible_facts['env']['PATH'] }}"
      block:
        - name: Install mise
          ansible.builtin.shell: |
            set -o pipefail
            curl -fsSL https://mise.run | sh
          args:
            executable: /bin/bash
            creates: "{{ ansible_facts['user_dir'] }}/.local/bin/mise"

        - name: Apply the dotfiles configuration with mise bootstrap
          become: true
          # Nested sudo calls cannot use Ansible's become password. Grant access
          # only for this run; the remote shell cleans up even if bootstrap fails.
          ansible.builtin.shell: |
            set -euo pipefail
            sudoers_file="$(/usr/bin/mktemp /etc/sudoers.d/99-mise-bootstrap-XXXXXX)"
            trap '/usr/bin/rm -f -- "$sudoers_file"' EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            printf '%s ALL=(root) NOPASSWD: ALL\n' "$BOOTSTRAP_USER" > "$sudoers_file"
            /usr/bin/chmod 0440 "$sudoers_file"
            /usr/sbin/visudo -cf "$sudoers_file"
            /usr/sbin/runuser -u "$BOOTSTRAP_USER" -- /usr/bin/env \
              -u SUDO_USER -u SUDO_UID -u SUDO_GID -u SUDO_COMMAND \
              mise bootstrap
          args:
            executable: /bin/bash
            chdir: "{{ ansible_facts['user_dir'] }}/dotfiles"
          environment:
            BOOTSTRAP_USER: "{{ ansible_facts['user_id'] }}"
            MISE_YES: "1"
            CODEX_NON_INTERACTIVE: "1"
            # Base install by default; set in inventory or via -e.
            # Example: -e '{"dotfiles_environments":["media","android"]}'
            MISE_ENV: "{{ dotfiles_environments | default([]) | join(',') }}"

    # opt in with --tags all,forwarding (or --tags forwarding for only this step).
    # docker may also enable runtime forwarding for its own bridge networks.
    - name: Enable persistent IP forwarding
      become: true
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-ip-forwarding.conf
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv4.conf.all.forwarding
        - net.ipv6.conf.all.forwarding
      tags: [never, forwarding]

    # opt in with --tags all,dns (or --tags dns for only this step).
    - name: Free up port 53 for DNS
      become: true
      tags: [never, dns]
      block:
        - name: Disable the systemd-resolved DNS stub listener
          ansible.builtin.lineinfile:
            path: /etc/systemd/resolved.conf
            regexp: '^\s*#?\s*DNSStubListener\s*='
            line: DNSStubListener=no
            insertafter: '^\[Resolve\]'
          register: dns_stub_listener

        - name: Reload systemd and restart systemd-resolved
          ansible.builtin.systemd_service:
            name: systemd-resolved
            daemon_reload: true
            state: restarted
          when: dns_stub_listener.changed

    - name: Install Docker Engine from Docker's official Ubuntu repository
      become: true
      tags: [docker]
      block:
        - name: Require Ubuntu for the Docker repository
          ansible.builtin.assert:
            that: ansible_facts['distribution'] == 'Ubuntu'
            fail_msg: This Docker installation block supports Ubuntu only.

        - name: Install repository prerequisites
          ansible.builtin.apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create the APT keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker's repository signing key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Read the Debian package architecture
          ansible.builtin.command:
            argv: [dpkg, --print-architecture]
          register: docker_architecture
          changed_when: false
          check_mode: false

        - name: Configure Docker's stable APT repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.sources
            mode: "0644"
            content: |
              Types: deb
              URIs: https://download.docker.com/linux/ubuntu
              Suites: {{ ansible_facts['distribution_release'] }}
              Components: stable
              Architectures: {{ docker_architecture.stdout }}
              Signed-By: /etc/apt/keyrings/docker.asc

        - name: Install Docker Engine, Buildx, and Compose
          ansible.builtin.apt:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
            state: present
            update_cache: true
            fail_on_autoremove: true

        - name: Enable and start Docker
          ansible.builtin.systemd_service:
            name: docker
            enabled: true
            state: started

        - name: Ensure the Docker group exists
          ansible.builtin.group:
            name: docker
            state: present

        - name: Add the remote user to the Docker group
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            groups: docker
            append: true

        - name: Reconnect to apply Docker group membership
          ansible.builtin.meta: reset_connection

        - name: Verify Docker can run hello-world
          ansible.builtin.command:
            argv: [docker, run, hello-world]
          changed_when: false
          when: not ansible_check_mode

        - name: Verify outbound container networking
          ansible.builtin.command:
            argv: [docker, run, --rm, alpine, ping, -c, "3", 8.8.8.8]
          changed_when: false
          when: not ansible_check_mode
