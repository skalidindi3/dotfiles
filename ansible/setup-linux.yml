---
- name: Configure Linux
  hosts: all
  remote_user: chaitu

  vars:
    dotfiles_repo: git@github.com:skalidindi3/dotfiles.git
    github_private_key_dest: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519"

  tasks:
    - name: Authorize this laptop's SSH key
      ansible.posix.authorized_key:
        user: chaitu
        key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"
        state: present
        exclusive: false
      tags: [access]

    - name: Install the GitHub private key without replacing existing contents
      tags: [github]
      block:
        - name: Require a source key path
          ansible.builtin.assert:
            that:
              - github_private_key_file is defined
              - github_private_key_file | default('') | length > 0
            fail_msg: Supply the controller's key path with -e github_private_key_file=/path/to/key.

        - name: Inspect the source key on the controller
          ansible.builtin.stat:
            path: "{{ github_private_key_file | expanduser }}"
            follow: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: github_source_key

        - name: Require a readable source key file
          ansible.builtin.assert:
            that:
              - github_source_key.stat.isreg | default(false)
              - github_source_key.stat.checksum is defined
            fail_msg: The source key must be an existing, readable regular file on the controller.

        - name: Inspect the destination key
          ansible.builtin.stat:
            path: "{{ github_private_key_dest }}"
            follow: false
            checksum_algorithm: sha256
          register: github_destination_key

        - name: Refuse to replace a different key or a non-regular destination
          ansible.builtin.assert:
            that:
              - >-
                not github_destination_key.stat.exists or
                ((github_destination_key.stat.isreg | default(false)) and
                 (github_destination_key.stat.checksum | default('')) == github_source_key.stat.checksum)
            fail_msg: The destination exists and differs from the source, or is not a regular file. It has not been overwritten.

        - name: Ensure the key directory is private
          ansible.builtin.file:
            path: "{{ github_private_key_dest | dirname }}"
            state: directory
            mode: "0700"

        - name: Copy the private key only when absent
          ansible.builtin.copy:
            src: "{{ github_private_key_file | expanduser }}"
            dest: "{{ github_private_key_dest }}"
            mode: "0600"
            force: false
          no_log: true
          diff: false

    - name: Install Ubuntu prerequisites
      become: true
      ansible.builtin.apt:
        name: [git, curl, ca-certificates, build-essential, zsh]
        state: present
        update_cache: true
      tags: [base]

    - name: Initialize Zsh
      tags: [zsh]
      block:
        - name: Register Zsh as an allowed login shell
          become: true
          ansible.builtin.lineinfile:
            path: /etc/shells
            line: /usr/bin/zsh

        - name: Create the Zsh cache directory
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.cache/zsh"
            state: directory
            mode: "0700"

        - name: Ensure the Zsh history file exists
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.cache/zsh/zsh_history"
            state: touch
            mode: "0600"
            access_time: preserve
            modification_time: preserve

        - name: Set Zsh as the remote user's login shell
          become: true
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            shell: /usr/bin/zsh

    - name: Configure GitHub SSH host verification
      tags: [dotfiles]
      block:
        - name: Ensure the remote SSH directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.ssh"
            state: directory
            mode: "0700"

        - name: Fetch GitHub's published host keys over verified HTTPS
          ansible.builtin.uri:
            url: https://api.github.com/meta
            return_content: true
            validate_certs: true
            use_netrc: false
          delegate_to: localhost
          become: false
          register: github_host_metadata

        - name: Add GitHub host keys to the remote known_hosts file
          ansible.builtin.known_hosts:
            path: "{{ ansible_facts['user_dir'] }}/.ssh/known_hosts"
            name: github.com
            key: "github.com {{ item }}"
            state: present
          loop: "{{ github_host_metadata.json.ssh_keys }}"

    - name: Download dotfiles to the remote user's home directory
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ ansible_facts['user_dir'] }}/dotfiles"
        key_file: "{{ github_private_key_dest }}"
        ssh_opts: -o StrictHostKeyChecking=yes
        # preserve an existing checkout and leave the private submodule uninitialized.
        update: false
        force: false
        recursive: false
      environment:
        GIT_TERMINAL_PROMPT: "0"
      tags: [dotfiles]

    - name: Initialize and bootstrap dotfiles
      tags: [dotfiles]
      environment:
        PATH: "{{ ansible_facts['user_dir'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:{{ ansible_facts['env']['PATH'] }}"
      block:
        - name: Install mise
          ansible.builtin.shell: |
            set -o pipefail
            curl -fsSL https://mise.run | sh
          args:
            executable: /bin/bash
            creates: "{{ ansible_facts['user_dir'] }}/.local/bin/mise"

        - name: Apply the dotfiles configuration with mise bootstrap
          become: true
          # Nested sudo calls cannot use Ansible's become password. Grant access
          # only for this run; the remote shell cleans up even if bootstrap fails.
          ansible.builtin.shell: |
            set -euo pipefail
            sudoers_file="$(/usr/bin/mktemp /etc/sudoers.d/99-mise-bootstrap-XXXXXX)"
            trap '/usr/bin/rm -f -- "$sudoers_file"' EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            printf '%s ALL=(root) NOPASSWD: ALL\n' "$BOOTSTRAP_USER" > "$sudoers_file"
            /usr/bin/chmod 0440 "$sudoers_file"
            /usr/sbin/visudo -cf "$sudoers_file"
            /usr/sbin/runuser -u "$BOOTSTRAP_USER" -- /usr/bin/env \
              -u SUDO_USER -u SUDO_UID -u SUDO_GID -u SUDO_COMMAND \
              mise bootstrap
          args:
            executable: /bin/bash
            chdir: "{{ ansible_facts['user_dir'] }}/dotfiles"
          environment:
            BOOTSTRAP_USER: "{{ ansible_facts['user_id'] }}"
            MISE_YES: "1"
            CODEX_NON_INTERACTIVE: "1"
            # Base install by default; set in inventory or via -e.
            # Example: -e '{"dotfiles_environments":["media","android"]}'
            MISE_ENV: "{{ dotfiles_environments | default([]) | join(',') }}"

    # Tailscale is installed by the dotfiles bootstrap above.
    # Opt in with --tags all,tailscale (or --tags tailscale after installation).
    # Supply headscale_url and headscale_preauth_key via -e or -e @vars.yml.
    - name: Initialize Tailscale with Headscale
      become: true
      tags: [never, tailscale]
      when: not ansible_check_mode
      vars:
        tailscale_backend_state: "{{ (tailscale_status.stdout | from_json)['BackendState'] }}"
        tailscale_login_server: "{{ headscale_url | regex_replace('/+$', '') }}"
      block:
        - name: Require the Headscale login server
          ansible.builtin.assert:
            that: headscale_url | default('') | length > 0
            fail_msg: Supply -e headscale_url=https://headscale.example.com.

        - name: Enable and start tailscaled
          ansible.builtin.systemd_service:
            name: tailscaled
            enabled: true
            state: started

        - name: Read the Tailscale login state
          ansible.builtin.command:
            argv: [tailscale, status, --json, --peers=false]
          register: tailscale_status
          changed_when: false
          until: >-
            tailscale_status.rc == 0 and
            (tailscale_status.stdout | from_json)['BackendState'] != 'NoState'
          retries: 5
          delay: 2

        - name: Read the configured Tailscale login server
          ansible.builtin.command:
            argv: [tailscale, debug, prefs]
          register: tailscale_preferences
          changed_when: false
          no_log: true

        - name: Check that Tailscale can be initialized without replacing an existing enrollment
          ansible.builtin.assert:
            that:
              - tailscale_backend_state in ['NeedsLogin', 'Stopped', 'Starting', 'Running']
              - >-
                tailscale_backend_state == 'NeedsLogin' or
                ((tailscale_preferences.stdout | from_json)['ControlURL'] |
                 regex_replace('/+$', '')) == tailscale_login_server
            fail_msg: >-
              Tailscale is in state {{ tailscale_backend_state }} and either needs
              administrator attention or uses a different login server.
              Resolve its existing enrollment before rerunning this step.

        - name: Require headscale_preauth_key when login is needed
          ansible.builtin.assert:
            that: headscale_preauth_key | default('') | trim | length > 0
          when: tailscale_backend_state == 'NeedsLogin'
          no_log: true

        - name: Enroll with the Headscale preauth key
          ansible.builtin.command:
            argv:
              - tailscale
              - up
              - "--login-server={{ tailscale_login_server }}"
              - --auth-key=file:/dev/stdin
              - --timeout=60s
            # Pass the key on stdin instead of placing it in process arguments.
            stdin: "{{ headscale_preauth_key }}"
          when: tailscale_backend_state == 'NeedsLogin'
          no_log: true

        - name: Reconnect a stopped Tailscale client using its existing enrollment
          ansible.builtin.command:
            # A bare "up" preserves existing settings; bound its wait externally.
            argv: [timeout, 60s, tailscale, up]
          when: tailscale_backend_state == 'Stopped'

        - name: Verify Tailscale is running and has an assigned address
          ansible.builtin.command:
            argv: [tailscale, status, --json, --peers=false]
          register: tailscale_connected
          changed_when: false
          until: >-
            tailscale_connected.rc == 0 and
            (tailscale_connected.stdout | from_json)['BackendState'] == 'Running' and
            (tailscale_connected.stdout | from_json)['TailscaleIPs'] | length > 0
          retries: 5
          delay: 2

    # opt in with --tags all,forwarding (or --tags forwarding for only this step).
    # docker may also enable runtime forwarding for its own bridge networks.
    - name: Enable persistent IP forwarding
      become: true
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-ip-forwarding.conf
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv4.conf.all.forwarding
        - net.ipv6.conf.all.forwarding
      tags: [never, forwarding]

    # opt in with --tags all,dns (or --tags dns for only this step).
    - name: Free up port 53 for DNS
      become: true
      tags: [never, dns]
      block:
        - name: Disable the systemd-resolved DNS stub listener
          ansible.builtin.lineinfile:
            path: /etc/systemd/resolved.conf
            regexp: '^\s*#?\s*DNSStubListener\s*='
            line: DNSStubListener=no
            insertafter: '^\[Resolve\]'
          register: dns_stub_listener

        - name: Reload systemd and restart systemd-resolved
          ansible.builtin.systemd_service:
            name: systemd-resolved
            daemon_reload: true
            state: restarted
          when: dns_stub_listener.changed

    - name: Install Docker Engine from Docker's official Ubuntu repository
      become: true
      tags: [docker]
      block:
        - name: Require Ubuntu for the Docker repository
          ansible.builtin.assert:
            that: ansible_facts['distribution'] == 'Ubuntu'
            fail_msg: This Docker installation block supports Ubuntu only.

        - name: Install repository prerequisites
          ansible.builtin.apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create the APT keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker's repository signing key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Read the Debian package architecture
          ansible.builtin.command:
            argv: [dpkg, --print-architecture]
          register: docker_architecture
          changed_when: false
          check_mode: false

        - name: Configure Docker's stable APT repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.sources
            mode: "0644"
            content: |
              Types: deb
              URIs: https://download.docker.com/linux/ubuntu
              Suites: {{ ansible_facts['distribution_release'] }}
              Components: stable
              Architectures: {{ docker_architecture.stdout }}
              Signed-By: /etc/apt/keyrings/docker.asc

        - name: Install Docker Engine, Buildx, and Compose
          ansible.builtin.apt:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
            state: present
            update_cache: true
            fail_on_autoremove: true

        - name: Enable and start Docker
          ansible.builtin.systemd_service:
            name: docker
            enabled: true
            state: started

        - name: Ensure the Docker group exists
          ansible.builtin.group:
            name: docker
            state: present

        - name: Add the remote user to the Docker group
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            groups: docker
            append: true

        - name: Reconnect to apply Docker group membership
          ansible.builtin.meta: reset_connection

        - name: Verify Docker can run hello-world
          ansible.builtin.command:
            argv: [docker, run, hello-world]
          changed_when: false
          when: not ansible_check_mode

        - name: Verify outbound container networking
          ansible.builtin.command:
            argv: [docker, run, --rm, alpine, ping, -c, "3", 8.8.8.8]
          changed_when: false
          when: not ansible_check_mode

    # Included on GNOME desktops by default; exclude with --skip-tags desktop.
    - name: Reduce Ubuntu desktop animations
      tags: [desktop]
      become: false
      block:
        - name: Check whether GNOME Shell is installed
          ansible.builtin.stat:
            path: /usr/bin/gnome-shell
          register: gnome_shell

        - name: Install the desktop settings dependencies
          become: true
          ansible.builtin.apt:
            name: [dconf-cli, dbus, python3-psutil, python3-gi]
            state: present
            update_cache: true
            cache_valid_time: 3600
          when: gnome_shell.stat.exists

        - name: Disable GNOME animations for the remote user
          community.general.dconf:
            key: /org/gnome/desktop/interface/enable-animations
            value: "false"
            state: present
          when: gnome_shell.stat.exists

    # Opt in with --tags all,tailscale-initramfs (or --tags tailscale-initramfs).
    # Supply headscale_url and a separate headscale_initramfs_preauth_key.
    # Tailscale and Dropbear's initramfs SSH configuration must already be installed.
    - name: Enable Tailscale in initramfs
      become: true
      tags: [never, tailscale-initramfs]
      when: not ansible_check_mode
      block:
        - name: Require the Headscale login server for initramfs
          ansible.builtin.assert:
            that: headscale_url | default('') | length > 0
            fail_msg: Supply -e headscale_url=https://headscale.example.com.

        - name: Check for an existing initramfs enrollment
          ansible.builtin.stat:
            path: /etc/tailscale/initramfs/tailscaled.state
            get_checksum: false
          register: tailscale_initramfs_state

        - name: Require headscale_initramfs_preauth_key for a new initramfs node
          ansible.builtin.assert:
            that: headscale_initramfs_preauth_key | default('') | trim | length > 0
          when: not tailscale_initramfs_state.stat.exists
          no_log: true

        - name: Install the repository certificate prerequisite
          ansible.builtin.apt:
            name: ca-certificates
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create the initramfs repository keyring directory
          ansible.builtin.file:
            path: /usr/local/share/keyrings
            state: directory
            mode: "0755"

        - name: Download the tailscale-initramfs repository signing key
          ansible.builtin.get_url:
            url: https://lugoues.github.io/tailscale-initramfs/public.key
            dest: /usr/local/share/keyrings/tailscale-initramfs-keyring.asc
            mode: "0644"

        - name: Configure the tailscale-initramfs APT repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/tailscale-initramfs.list
            mode: "0644"
            content: |
              deb [signed-by=/usr/local/share/keyrings/tailscale-initramfs-keyring.asc] https://lugoues.github.io/tailscale-initramfs/repo stable main

        - name: Install tailscale-initramfs
          ansible.builtin.apt:
            name: tailscale-initramfs
            state: present
            update_cache: true

        - name: Enroll the initramfs node with Headscale
          ansible.builtin.command:
            argv:
              - setup-initramfs-tailscale
              - "--hostname={{ ansible_facts['hostname'] }}-initramfs"
              - "--login-server={{ headscale_url | regex_replace('/+$', '') }}"
              - --auth-key=file:/dev/stdin
              - --timeout=60s
            # Omit --ssh so Dropbear provides SSH; preserve an existing enrollment.
            creates: /etc/tailscale/initramfs/tailscaled.state
            stdin: "{{ headscale_initramfs_preauth_key | default('') }}"
          no_log: true

        # The upstream helper's EXIT trap can mask errors; check its saved outputs.
        - name: Inspect the saved initramfs configuration
          ansible.builtin.stat:
            path: "{{ item }}"
            get_checksum: false
          loop:
            - /etc/tailscale/initramfs/tailscaled.state
            - /etc/tailscale/initramfs/default.env
          register: tailscale_initramfs_outputs

        - name: Require a completed initramfs enrollment before rebuilding
          ansible.builtin.assert:
            that:
              - item.stat.isreg | default(false)
              - item.stat.size | default(0) > 0
            fail_msg: >-
              Initramfs enrollment is incomplete. Check the preauth key and
              /tmp/setup-initramfs-tailscale-daemon.log on the remote host.
          loop: "{{ tailscale_initramfs_outputs.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Rebuild initramfs with Tailscale enabled
          ansible.builtin.command:
            argv: [update-initramfs, -u, -v]
