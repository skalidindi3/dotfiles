min_version = "2026.10.8"

[settings]
task.run_auto_install = false
dotfiles.root = "."

[vars]
python_version = "3.15.0"

[tools]
go = "latest"
rust = "latest"
uv = "latest"

# `mise bootstrap` runs
# - pre-packages, packages, post-packages
# - repos
# - dotfiles
# - pre-tools, tools, post-tools

[bootstrap.hooks]
pre-packages = [
  'bash ./mise-bootstrap/setup-1pass-ppa.sh',
  'bash ./mise-bootstrap/setup-tailscale-ppa.sh',
  'bash ./mise-bootstrap/setup-docker-ppa.sh',
]
post-packages = [
  'bash ./mise-bootstrap/setup-docker-user.sh',
  'bash ./mise-bootstrap/test-docker.sh',
]
post-tools = [
  'mise use -g go rust uv',
  'mise exec -- uv python install {{ vars.python_version }}',
  'mise exec -- uv python pin --global {{ vars.python_version }}',
]

[bootstrap.packages]
# system utilities and shared libs use native package manager
"apt:curl" = { os = "linux" }
"brew:curl" = { os = "macos" }
"apt:wget" = { os = "linux" }
"brew:wget" = { os = "macos" }
"apt:rsync" = { os = "linux" }
"brew:rsync" = { os = "macos" }
"apt:moreutils" = { os = "linux" } # vidir
"brew:moreutils" = { os = "macos" } # vidir
"apt:net-tools" = { os = "linux" }
"brew:net-tools" = { os = "macos" }
"apt:tailscale" = { os = "linux" }
"brew-cask:tailscale-app" = { os = "macos" }
"apt:xclip" = { os = "linux" }

# cli/dev tools use homebrew (and avoid sudo install)
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:antidote" = "latest"
"brew:lsd" = "latest"
"brew:ripgrep" = "latest"
"brew:fzf" = "latest"
"brew:zoxide" = "latest"
"brew:lazygit" = "latest"
"brew:jq" = "latest"
"brew-cask:rar" = "latest"
"brew:dust" = "latest"
"brew:duf" = "latest"
"brew:htop" = "latest"
"brew-cask:1password-cli" = "latest"
"brew:fd" = "latest"
"brew:qrencode" = "latest"

# docker
"apt:docker-ce" = { os = "linux" }
"apt:docker-ce-cli" = { os = "linux" }
"apt:containerd.io" = { os = "linux" }
"apt:docker-buildx-plugin" = { os = "linux" }
"apt:docker-compose-plugin" = { os = "linux" }

# opt-in installation with `mise bootstrap -E mpd`
"brew:mpd" = { env = "mpd" }
"brew:mpdscribble" = { env = "mpd" }
"brew:ncmpcpp" = { env = "mpd" }

# opt-in installation with `mise bootstrap -E media`
"apt:ffmpeg" = { env = "media", os = "linux" }
"brew:ffmpeg" = { env = "media", os = "macos" }
"apt:libimage-exiftool-perl" = { env = "media", os = "linux" }
"brew:exiftool" = { env = "media", os = "macos" }
"brew:sox" = { env = "media" }

# opt-in installation with `mise bootstrap -E android`
"apt:android-sdk-platform-tools" = { env = "android", os = "linux" }
"apt:adb" = { env = "android", os = "linux" }
"brew-cask:android-platform-tools" = { env = "android", os = "macos" }

[bootstrap.repos."~/.config/tmux/plugins/tpm"]
url = "https://github.com/tmux-plugins/tpm"

[dotfile_groups.home]
root = "home"
target = "~"
mode = "symlink-each"
relative = true

[tasks.adopt]
description = "Preview importing a local file into home/"
usage = 'arg "<file>" help="Existing file to import"'
run = 'mise dot add --group home --force --dry-run -- "${usage_file?}"'

[tasks.adopt_unsafe]
description = "Import a local file into home/, replacing its source, and link it back"
usage = 'arg "<file>" help="Existing file to import"'
run = 'mise dot add --group home --force --yes -- "${usage_file?}"'

[tasks.clean]
description = "Unapply this checkout's mise dotfile links"
run = 'mise dot unapply --yes --group home'
