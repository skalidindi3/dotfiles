min_version = "2026.10.8"

[settings]
dotfiles.root = "."

[bootstrap.hooks]
pre-packages = [
  'bash ./mise-bootstrap/setup-1pass-ppa.sh',
  'bash ./mise-bootstrap/setup-tailscale-ppa.sh',
  'bash ./mise-bootstrap/setup-docker-ppa.sh',
]
post-packages = [
  'bash ./mise-bootstrap/setup-docker-user.sh',
  'bash ./mise-bootstrap/test-docker.sh',
]
pre-dotfiles = [
  'python3 ./mise-bootstrap/backup-dotfiles.py',
]
post-tools = [
  'bash -o pipefail -c "curl -fsSL https://chatgpt.com/codex/install.sh | sh"',
]

[bootstrap.repos."~/.config/tmux/plugins/tpm"]
url = "https://github.com/tmux-plugins/tpm"

[dotfile_groups.home]
root = "home"
target = "~"
mode = "symlink-each"
relative = true

[tasks.bootstrap]
quiet = true
run = '''
local_config_path="{{ config_root }}/home/.config/mise/miserc.local.toml"
if [ ! -f "$local_config_path" ]; then
  printf '\nReminder: create %s to select environments for this machine.\n' "$local_config_path"
fi
'''

[tasks.upgrade]
description = "Refresh package metadata and upgrade configured packages and tools"
raw = true
run = [
  "mise bootstrap packages upgrade",
  "mise upgrade --global",
  'uv tool upgrade --all',
]

[tasks.adopt]
description = "Preview importing a local file into home/"
usage = 'arg "<file>" help="Existing file to import"'
run = 'mise dot add --group home --force --dry-run -- "${usage_file?}"'

[tasks.adopt_unsafe]
description = "Import a local file into home/, replacing its source, and link it back"
usage = 'arg "<file>" help="Existing file to import"'
run = 'mise dot add --group home --force --yes -- "${usage_file?}"'

[tasks.clean]
description = "Unapply this checkout's mise dotfile links"
run = 'mise dot unapply --yes --group home'

[tasks.install_beets]
description = "Install beets with the selected extras"
run = "uv tool install 'beets[embedart,fetchart,lastgenre,lyrics,scrub]'"
